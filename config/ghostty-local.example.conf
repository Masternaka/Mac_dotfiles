# Modèle Ghostty local, à préparer soi-même dans ~/.config/ghostty-local.conf.
# Ce fichier reste hors du paquet Stow et n'est pas copié automatiquement.
# Décommenter uniquement les réglages utiles sur la machine cible.

# Remplacer la police du dépôt. Décommenter les deux lignes ensemble.
# Adapter le nom à une famille disponible sur le Mac cible.
# font-family = ""
# font-family = "Menlo"

# Écran plus dense ou besoin de caractères plus grands.
# font-size = 16

# Fenêtre initiale plus compacte.
# window-width = 110
# window-height = 30

# Fond opaque pour privilégier la lisibilité.
# background-opacity = 1

# Pour retirer une préférence, commenter sa ligne puis recharger manuellement.
# Ne pas inclure le fichier principal ici : cela créerait une boucle.
