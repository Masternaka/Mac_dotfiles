# Catppuccin Mocha pour Starship
# Source : https://github.com/catppuccin/starship
# Destination : ~/.config/starship.toml (via GNU Stow)

"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"

# Deux lignes utiles, sans afficher tous les modules disponibles par défaut.
# Les modules de langages gardent leur détection contextuelle native.
format = "$username$hostname$directory$git_branch$git_state$git_status$nodejs$python$swift$cmd_duration$line_break$status$character"
add_newline = true

[character]
success_symbol = "[[󰄛](green) ❯](peach)"
error_symbol = "[[󰄛](red) ❯](red)"
vimcmd_symbol = "[󰄛 ❮](subtext1)"

[git_branch]
style = "bold mauve"
format = '[$symbol$branch]($style) '

[git_state]
style = "bold yellow"

# Compteurs compacts : modifications, index, fichiers inconnus et suivi distant.
[git_status]
style = "bold yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = '!${count}'
stashed = '*${count}'
deleted = '-${count}'
renamed = '»${count}'
modified = '~${count}'
staged = '+${count}'
untracked = '?${count}'
ahead = '↑${count}'
behind = '↓${count}'
diverged = '↑${ahead_count}↓${behind_count}'

[cmd_duration]
min_time = 2000
format = '[durée $duration]($style) '
style = "yellow"
show_notifications = false

# Le code n'apparaît qu'en cas d'échec, sur la ligne de saisie.
[status]
disabled = false
success_symbol = ''
format = '[code $status]($style) '
style = "bold red"

[nodejs]
format = '[Node $version]($style) '
style = "green"

[python]
format = '[Python $version( \($virtualenv\))]($style) '
style = "yellow"

[swift]
format = '[Swift $version]($style) '
style = "peach"

[directory]
truncation_length = 4
style = "bold lavender"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
